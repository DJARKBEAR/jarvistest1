<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#02040a;color:#c5e8f7;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;overflow:hidden;position:relative}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:44px 44px;animation:gm 20s linear infinite}
@keyframes gm{from{background-position:0 0}to{background-position:44px 44px}}
.bg-glow{position:fixed;inset:-50%;z-index:0;pointer-events:none;background:radial-gradient(circle at center,rgba(0,212,255,.09) 0%,transparent 55%);animation:pu 9s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:1}}
.scanlines{position:fixed;inset:0;z-index:999;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.014) 3px,transparent 4px);mix-blend-mode:overlay}
.container{width:100%;max-width:1000px;position:relative;z-index:10;display:flex;flex-direction:column;height:100%;max-height:100vh}
.header{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;gap:12px;padding:6px 0 12px;flex-shrink:0}
.orb{width:68px;height:68px}
.orb svg{width:100%;height:100%}
.orb .ro,.orb .rm,.orb .ri{transform-origin:50px 50px;animation:sp 12s linear infinite}
.orb .rm{animation-duration:8s;animation-direction:reverse}
.orb .ri{animation-duration:5s}
@keyframes sp{to{transform:rotate(360deg)}}
.orb .core{animation:cp 2.4s ease-in-out infinite;transform-origin:50px 50px}
@keyframes cp{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.orb.listening .core{animation-duration:.9s}
.orb.thinking .core{animation-duration:.5s}
.orb.speaking .core{animation-duration:.7s}
.tb{text-align:center}
.tb h1{font-size:26px;letter-spacing:12px;color:#00d4ff;font-weight:300;margin-left:12px;text-shadow:0 0 20px rgba(0,212,255,.7),0 0 60px rgba(0,212,255,.3);animation:tg 4s ease-in-out infinite}
@keyframes tg{0%,100%{text-shadow:0 0 20px rgba(0,212,255,.6),0 0 60px rgba(0,212,255,.3)}50%{text-shadow:0 0 30px rgba(0,212,255,.95),0 0 80px rgba(0,212,255,.5)}}
.st{font-size:11px;color:#4a7a9b;letter-spacing:3px;text-transform:uppercase;margin-top:6px;height:14px;transition:color .3s}
.st.listening{color:#00ff88;animation:bl 1.2s ease-in-out infinite}
.st.thinking{color:#ffaa00;animation:bl .8s ease-in-out infinite}
.st.speaking{color:#00d4ff;animation:bl 1s ease-in-out infinite}
.st.error{color:#dc2626}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.35}}
.diag{display:flex;flex-direction:column;gap:4px;font-size:9px;color:#3d5a73;letter-spacing:1.5px;text-transform:uppercase;text-align:right}
.diag .bar{width:60px;height:3px;background:rgba(0,212,255,.1);border-radius:2px;overflow:hidden;margin-left:auto}
.diag .bar>div{height:100%;background:#00d4ff;transition:width .5s;box-shadow:0 0 6px #00d4ff}
.waveform-wrap{height:34px;margin-bottom:10px;flex-shrink:0;background:rgba(10,16,28,.6);border:1px solid rgba(0,212,255,.15);border-radius:8px;overflow:hidden}
#waveform{width:100%;height:100%;display:block}
.chat-wrapper{flex:1;position:relative;background:rgba(10,16,28,.75);border:1px solid rgba(0,212,255,.2);border-radius:4px;padding:20px;overflow-y:auto;margin-bottom:12px;backdrop-filter:blur(12px);scroll-behavior:smooth;min-height:0;box-shadow:inset 0 0 60px rgba(0,212,255,.04),0 4px 40px rgba(0,0,0,.5)}
.chat-wrapper::before,.chat-wrapper::after,.chat-wrapper>.cbl,.chat-wrapper>.cbr{content:'';position:absolute;width:18px;height:18px;border-color:#00d4ff;pointer-events:none}
.chat-wrapper::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.chat-wrapper::after{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid}
.chat-wrapper>.cbl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid}
.chat-wrapper>.cbr{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}
.chat-wrapper::-webkit-scrollbar{width:6px}
.chat-wrapper::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.msg{margin-bottom:16px;line-height:1.65;font-size:15px;animation:fi .35s cubic-bezier(.2,.8,.2,1);display:flex;gap:12px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg .label{font-weight:700;min-width:62px;flex-shrink:0;font-size:12px;padding-top:3px;letter-spacing:1px}
.msg.user .label{color:#7dd3fc}
.msg.user .text{color:#cbe9fb}
.msg.jarvis .label{color:#00d4ff}
.msg.jarvis .text{color:#e8faff}
.msg.system .label{color:#475569}
.msg.system .text{color:#64748b;font-style:italic;font-size:13px}
.msg.error .label{color:#dc2626}
.msg.error .text{color:#fca5a5}
.msg .text{flex:1;word-wrap:break-word;white-space:pre-wrap}
.typing{display:none;gap:4px;padding:6px 0 12px 74px}
.typing.active{display:flex}
.typing span{width:7px;height:7px;border-radius:50%;background:#00d4ff;animation:bo 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bo{0%,80%,100%{transform:scale(.5);opacity:.35}40%{transform:scale(1);opacity:1}}
.input-area{display:flex;gap:8px;align-items:center;flex-shrink:0}
.input-area input{flex:1;background:rgba(20,30,48,.9);border:1px solid rgba(0,212,255,.25);color:#e0f7ff;padding:14px 16px;border-radius:6px;font-size:15px;outline:none;transition:border-color .3s,box-shadow .3s;font-family:inherit;min-width:0}
.input-area input:focus{border-color:#00d4ff;box-shadow:0 0 24px rgba(0,212,255,.25)}
.input-area input::placeholder{color:#4a7a9b}
.btn{background:rgba(0,212,255,.1);border:1px solid #00d4ff;color:#00d4ff;padding:14px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;font-family:inherit;white-space:nowrap;flex-shrink:0;letter-spacing:1px}
.btn:hover:not(:disabled){background:rgba(0,212,255,.25);box-shadow:0 0 20px rgba(0,212,255,.3)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.mic{font-size:18px;padding:14px 15px}
.btn.mic.listening{background:rgba(220,38,38,.3);border-color:#dc2626;color:#fca5a5;animation:mp 1.2s ease-in-out infinite}
@keyframes mp{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mode-bar{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:12px;flex-wrap:wrap;flex-shrink:0}
.mode-toggle{display:flex;align-items:center;gap:6px;color:#4a7a9b;cursor:pointer;user-select:none;transition:color .3s}
.mode-toggle:hover{color:#7dd3fc}
.mode-toggle.active{color:#00ff88}
.mode-toggle.active.voice{color:#00d4ff}
.mode-toggle .dot{width:8px;height:8px;border-radius:50%;background:currentColor;transition:all .3s}
.mode-toggle.active .dot{box-shadow:0 0 8px currentColor}
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#0a1220;border:1px solid #00d4ff;border-radius:8px;padding:28px;max-width:560px;width:100%;box-shadow:0 0 60px rgba(0,212,255,.3);max-height:90vh;overflow-y:auto}
.modal h2{color:#00d4ff;font-size:16px;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;font-weight:400}
.modal h3{color:#7dd3fc;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;font-weight:400;border-bottom:1px solid rgba(0,212,255,.15);padding-bottom:6px}
.modal p{color:#7dd3fc;font-size:13px;line-height:1.6;margin-bottom:16px}
.modal a{color:#00d4ff}
.modal label{display:block;color:#4a7a9b;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.modal input[type=password],.modal input[type=text],.modal select{width:100%;background:rgba(20,30,48,.9);border:1px solid rgba(0,212,255,.3);color:#e0f7ff;padding:12px 14px;border-radius:6px;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.modal input:focus,.modal select:focus{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.2)}
.modal input[type=range]{width:100%;margin-bottom:12px}
.modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.modal-buttons .btn{padding:10px 18px;font-size:13px}
.modal-buttons .btn.ghost{background:transparent;border-color:#4a7a9b;color:#4a7a9b}
.modal-buttons .btn.ghost:hover{border-color:#7dd3fc;color:#7dd3fc}
.key-status{font-size:12px;margin-top:14px;text-align:center;letter-spacing:1px}
.key-status.ok{color:#00ff88}
.key-status.missing{color:#ffaa00}
.key-status.err{color:#dc2626}
.help-list{list-style:none;font-size:12px;color:#7dd3fc;line-height:1.8}
.help-list code{background:rgba(0,212,255,.1);padding:2px 6px;border-radius:3px;color:#00d4ff;font-family:'Consolas',monospace}
@media (max-width:700px){
.header{grid-template-columns:56px 1fr 56px}
.orb{width:48px;height:48px}
.tb h1{font-size:18px;letter-spacing:6px}
.diag{display:none}
.msg .label{min-width:48px;font-size:11px}
.msg{font-size:14px}
.btn{padding:12px 13px;font-size:13px}
.btn.mic{font-size:16px;padding:12px 12px}
.mode-bar{font-size:11px;gap:8px}
.waveform-wrap{height:26px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scanlines"></div>

<div class="container">
<div class="header">
<div class="orb" id="orb">
<svg viewBox="0 0 100 100">
<defs>
<radialGradient id="cg" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#e0faff"/>
<stop offset="40%" stop-color="#00d4ff"/>
<stop offset="100%" stop-color="#0066aa" stop-opacity="0"/>
</radialGradient>
<filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle class="core" cx="50" cy="50" r="16" fill="url(#cg)" filter="url(#gl)"/>
<g class="ro" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity=".7"><circle cx="50" cy="50" r="44" stroke-dasharray="8 6 4 6"/></g>
<g class="rm" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".9"><circle cx="50" cy="50" r="34" stroke-dasharray="14 8"/></g>
<g class="ri" fill="none" stroke="#7dd3fc" stroke-width=".8" opacity=".85"><circle cx="50" cy="50" r="24" stroke-dasharray="3 4"/></g>
</svg>
</div>
<div class="tb">
<h1>J A R V I S</h1>
<div class="st" id="status">● ONLINE</div>
</div>
<div class="diag">
<div>CPU <span id="dCpu">—</span>%</div>
<div class="bar"><div id="cpuBar" style="width:0%"></div></div>
<div>MEM <span id="dMem">—</span>%</div>
<div class="bar"><div id="memBar" style="width:0%"></div></div>
</div>
</div>

<div class="waveform-wrap"><canvas id="waveform"></canvas></div>

<div class="chat-wrapper" id="chat">
<div class="cbl"></div><div class="cbr"></div>
<div class="typing" id="typing"><span></span><span></span><span></span></div>
</div>

<div class="input-area">
<input id="input" placeholder="Ask JARVIS anything... (try /help)" autocomplete="off" autofocus>
<button type="button" class="btn mic" id="micBtn" title="Click to speak">🎤</button>
<button type="button" class="btn" id="sendBtn">SEND</button>
</div>

<div class="mode-bar">
<div class="mode-toggle" id="continuousToggle" title="Wake word: 'Jarvis'"><span class="dot"></span><span>Continuous</span></div>
<div class="mode-toggle voice active" id="voiceToggle" title="Speak responses aloud"><span class="dot"></span><span>Voice</span></div>
<div class="mode-toggle" id="settingsBtn" title="Open settings"><span class="dot" style="background:#00d4ff"></span><span>Settings</span></div>
<div class="mode-toggle" id="clearBtn" title="Clear conversation"><span class="dot" style="background:#dc2626"></span><span>Clear</span></div>
<div class="mode-toggle" id="wipeBtn" title="Erase all memory"><span class="dot" style="background:#7f1d1d"></span><span>Wipe</span></div>
</div>
</div>

<div class="modal-overlay" id="settingsModal">
<div class="modal">
<h2>JARVIS Settings</h2>

<h3>Gemini API Key</h3>
<p style="font-size:12px">Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a>. Starts with <code>AQ.</code> or <code>AIzaSy</code>.</p>
<label for="keyInput">API Key</label>
<input type="password" id="keyInput" placeholder="AQ.Ab8RN6..." autocomplete="off" spellcheck="false">

<h3>Model</h3>
<label for="modelSelect">Model</label>
<select id="modelSelect">
<option value="gemini-2.5-flash">Gemini 2.5 Flash (recommended)</option>
<option value="gemini-2.5-pro">Gemini 2.5 Pro (slower, higher quality)</option>
<option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
</select>

<h3>Behaviour</h3>
<label for="tempSlider">Temperature: <span id="tempVal">0.75</span></label>
<input type="range" id="tempSlider" min="0" max="1.5" step="0.05" value="0.75">
<label for="voiceSelect">Voice</label>
<select id="voiceSelect"></select>

<h3>Memory</h3>
<p style="font-size:12px">Export or import your JARVIS memory (facts, topics, profile) as JSON.</p>
<div class="modal-buttons" style="justify-content:flex-start">
<button type="button" class="btn ghost" id="exportBtn">Export</button>
<button type="button" class="btn ghost" id="importBtn">Import</button>
<input type="file" id="importFile" style="display:none" accept=".json">
</div>

<div class="key-status" id="keyStatus"></div>

<div class="modal-buttons" style="margin-top:20px">
<button type="button" class="btn ghost" id="keyClear">Remove Key</button>
<button type="button" class="btn ghost" id="keyCancel">Cancel</button>
<button type="button" class="btn" id="keySave">Save &amp; Test</button>
</div>
</div>
</div>

<script>
(function(){
'use strict';

// ============================================================
// JARVIS — built from the ground up.
// Four custom algorithms:
//   1. Router: scores every input to decide local / memory / gemini
//   2. ContextRanker: relevance-ranks history instead of blind slicing
//   3. Consolidator: merges duplicate facts, decays old ones
//   4. MoodClassifier: adjusts tone based on user's message
// ============================================================

// ---------- DOM ----------
var chat=document.getElementById('chat');
var input=document.getElementById('input');
var sendBtn=document.getElementById('sendBtn');
var micBtn=document.getElementById('micBtn');
var statusEl=document.getElementById('status');
var typing=document.getElementById('typing');
var continuousToggle=document.getElementById('continuousToggle');
var voiceToggle=document.getElementById('voiceToggle');
var clearBtn=document.getElementById('clearBtn');
var wipeBtn=document.getElementById('wipeBtn');
var settingsBtn=document.getElementById('settingsBtn');
var orb=document.getElementById('orb');
var diagCpu=document.getElementById('dCpu');
var diagMem=document.getElementById('dMem');
var cpuBar=document.getElementById('cpuBar');
var memBar=document.getElementById('memBar');
var settingsModal=document.getElementById('settingsModal');
var keyInput=document.getElementById('keyInput');
var keySave=document.getElementById('keySave');
var keyCancel=document.getElementById('keyCancel');
var keyClear=document.getElementById('keyClear');
var keyStatus=document.getElementById('keyStatus');
var modelSelect=document.getElementById('modelSelect');
var tempSlider=document.getElementById('tempSlider');
var tempVal=document.getElementById('tempVal');
var voiceSelect=document.getElementById('voiceSelect');
var exportBtn=document.getElementById('exportBtn');
var importBtn=document.getElementById('importBtn');
var importFile=document.getElementById('importFile');

// ---------- CONFIG ----------
var WAKE_WORD='jarvis';
var KEYS={
  api:'jarvis_key_v10',
  mem:'jarvis_mem_v10',
  chat:'jarvis_chat_v10',
  profile:'jarvis_profile_v10',
  settings:'jarvis_settings_v10'
};
var MAX_CHAT=200;
var GEMINI_BASE='https://generativelanguage.googleapis.com/v1beta/models';

// ---------- STATE ----------
var cfg=loadJSON(KEYS.settings,{model:'gemini-2.5-flash',temperature:0.75,voiceURI:null});
var apiKey=localStorage.getItem(KEYS.api)||'';
var memory=loadJSON(KEYS.mem,{facts:[],topics:{}});
var chatLog=loadJSON(KEYS.chat,[]);
var profile=loadJSON(KEYS.profile,{name:null,createdAt:Date.now(),lastSeen:Date.now(),sessions:0,totalTurns:0,favoriteTopics:{}});
var isProcessing=false;
var continuousMode=false;
var voiceOutput=true;
var recognition=null;
var isListening=false;
var wakeListener=null;
var audioCtx=null;
var analyser=null;
var micData=null;
var wavePhase=0;
var currentSpeech=null;

profile.sessions=(profile.sessions||0)+1;
profile.lastSeen=Date.now();
saveJSON(KEYS.profile,profile);

// ---------- STORAGE ----------
function loadJSON(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function saveMemory(){saveJSON(KEYS.mem,memory)}
function saveChat(){if(chatLog.length>MAX_CHAT)chatLog=chatLog.slice(-MAX_CHAT);saveJSON(KEYS.chat,chatLog)}
function saveProfile(){saveJSON(KEYS.profile,profile)}
function saveCfg(){saveJSON(KEYS.settings,cfg)}

// ============================================================
// ALGORITHM 1 — MESSAGE ROUTER
// Scores every input to decide the best response path.
// ============================================================
function routeMessage(text){
  var t=text.toLowerCase().trim();
  var s={local:0,memory:0,gemini:0};

  // Slash commands always local
  if(t.charAt(0)==='/'){s.local+=100;return{path:'local',scores:s}}

  // Command keywords
  if(/^(time|date|hello|hi|hey|thanks|thank you)\b/.test(t))s.local+=10;
  if(/^(remember|note|forget|my name is|i am|call me)\b/.test(t))s.local+=12;
  if(/^(clear|reset|wipe)\b/.test(t))s.local+=15;

  // Memory recall signals
  if(/^(what|who|do you remember|what do you know)/.test(t)){
    s.memory+=3;
    var words=t.split(/\W+/).filter(function(w){return w.length>3});
    words.forEach(function(w){
      if(memory.facts.some(function(f){return f.key.toLowerCase()===w}))s.memory+=10;
    });
  }

  // Gemini signals — anything open-ended, long, or question-shaped
  if(t.length>50)s.gemini+=4;
  if(t.length>120)s.gemini+=3;
  if(/\b(explain|how|why|analyze|analyse|compare|write|describe|summarize|discuss|tell me about)\b/.test(t))s.gemini+=8;
  if(/\?/.test(t)&&!/^(what|who|do you remember)/.test(t))s.gemini+=3;
  if(/\b(code|program|algorithm|math|calculate|equation)\b/.test(t))s.gemini+=5;

  // Simple math is local
  if(/^\s*(what(?:'s| is)\s+)?-?\d+(\.\d+)?\s*[\+\-\*\/x]\s*-?\d+(\.\d+)?\s*\??\s*$/.test(t))s.local+=20;

  var best='gemini';var max=-1;
  Object.keys(s).forEach(function(k){if(s[k]>max){max=s[k];best=k}});
  return{path:best,scores:s};
}

// ============================================================
// ALGORITHM 2 — CONTEXT RANKER
// Ranks history by word overlap with current message plus
// a recency bonus, instead of blindly sending the last N turns.
// ============================================================
function rankContext(currentText,turns,maxTurns){
  if(!turns.length)return[];
  var curr=new Set((currentText.toLowerCase().match(/\b\w{4,}\b/g)||[]));
  var now=Date.now();
  var scored=turns.map(function(t){
    var w=t.text.toLowerCase().match(/\b\w{4,}\b/g)||[];
    var overlap=0;
    w.forEach(function(x){if(curr.has(x))overlap++});
    var ageMinutes=(now-(t.time||now))/60000;
    var recency=ageMinutes<5?3:ageMinutes<60?1.5:ageMinutes<1440?0.5:0;
    return{turn:t,score:overlap*2+recency};
  });
  scored.sort(function(a,b){return b.score-a.score});
  return scored.slice(0,maxTurns).map(function(x){return x.turn})
    .sort(function(a,b){return(a.time||0)-(b.time||0)});
}

// ============================================================
// ALGORITHM 3 — MEMORY CONSOLIDATOR
// Merges near-duplicate facts (fuzzy key match), decays
// untouched facts older than 30 days unless accessed.
// ============================================================
function similarity(a,b){
  a=a.toLowerCase();b=b.toLowerCase();
  if(a===b)return 1;
  var la=a.length,lb=b.length;
  if(la<2||lb<2)return 0;
  var longer=la>lb?a:b,shorter=la>lb?b:a;
  var matches=0;
  var sIdx=0;
  for(var i=0;i<longer.length&&sIdx<shorter.length;i++){
    if(longer[i]===shorter[sIdx]){matches++;sIdx++}
  }
  return matches/Math.max(la,lb);
}

function consolidateMemory(){
  var now=Date.now();
  var THIRTY_DAYS=30*24*60*60*1000;
  var kept=[];
  memory.facts.forEach(function(f){
    var age=now-(f.time||now);
    var accessed=(f.accessCount||0)>0;
    if(age<THIRTY_DAYS||accessed){
      // find near-duplicate in kept
      var dup=null;
      for(var i=0;i<kept.length;i++){
        if(similarity(kept[i].key,f.key)>0.85){dup=kept[i];break}
      }
      if(dup){
        // newer value wins; preserve access count
        dup.value=f.value;
        dup.time=f.time;
        dup.accessCount=(dup.accessCount||0)+(f.accessCount||0);
      }else{
        kept.push(f);
      }
    }
  });
  memory.facts=kept;
  saveMemory();
}

// ============================================================
// ALGORITHM 4 — MOOD CLASSIFIER
// Detects user's tone and adjusts JARVIS's reply style.
// ============================================================
function detectMood(text){
  var t=text.toLowerCase();
  if(/\b(urgent|asap|emergency|right now|hurry|quickly|fast)\b/.test(t))return'urgent';
  if(/\b(thanks|thank you|great|awesome|perfect|love|nice|cool|excellent)\b/.test(t))return'positive';
  if(/\b(hate|angry|mad|stupid|broken|useless|terrible|awful|frustrat)\b/.test(t))return'frustrated';
  if(/\b(confus|don'?t understand|unclear|lost)\b/.test(t))return'confused';
  if(text.length>200)return'detailed';
  if(text.length<15)return'brief';
  return'neutral';
}

function moodInstruction(mood){
  switch(mood){
    case'urgent':return'User sounds rushed. Be direct and skip pleasantries.';
    case'positive':return'User is in a good mood. You may allow one dry remark.';
    case'frustrated':return'User is frustrated. Be crisp, useful, no humor.';
    case'confused':return'User seems confused. Explain clearly, step by step.';
    case'detailed':return'User gave a long message. Match their level of detail.';
    case'brief':return'User is terse. Reply in one short sentence.';
    default:return'';
  }
}

// ---------- MEMORY OPS ----------
function rememberFact(key,value){
  var existing=memory.facts.find(function(f){return f.key.toLowerCase()===key.toLowerCase()});
  if(existing){existing.value=value;existing.time=Date.now();existing.accessCount=(existing.accessCount||0)+1}
  else memory.facts.push({key:key,value:value,time:Date.now(),accessCount:0});
  if(memory.facts.length>100)memory.facts.shift();
  saveMemory();
}
function getFact(key){
  var f=memory.facts.find(function(f){return f.key.toLowerCase()===key.toLowerCase()});
  if(f){f.accessCount=(f.accessCount||0)+1;saveMemory();return f.value}
  return null;
}
function forgetFact(key){
  var before=memory.facts.length;
  memory.facts=memory.facts.filter(function(f){return f.key.toLowerCase()!==key.toLowerCase()});
  saveMemory();
  return memory.facts.length<before;
}
function trackTopic(text){
  var stop={the:1,a:1,an:1,is:1,are:1,was:1,were:1,to:1,of:1,in:1,on:1,for:1,and:1,or:1,but:1,it:1,this:1,that:1,what:1,how:1,why:1,when:1,where:1,who:1,my:1,your:1,me:1,i:1,you:1,do:1,does:1,did:1,can:1,could:1,would:1,should:1,will:1,be:1,have:1,has:1,had:1,with:1,about:1,from:1,at:1,by:1,as:1,so:1,if:1,then:1,than:1,just:1,get:1,got:1,know:1,think:1,tell:1,say:1,said:1,like:1,also:1,some:1,any:1,all:1,more:1,most:1,very:1,only:1};
  var words=text.toLowerCase().match(/\b[a-z]{4,}\b/g)||[];
  words.forEach(function(w){
    if(stop[w])return;
    memory.topics[w]=(memory.topics[w]||0)+1;
    profile.favoriteTopics[w]=(profile.favoriteTopics[w]||0)+1;
  });
  var e=Object.entries(memory.topics).sort(function(a,b){return b[1]-a[1]}).slice(0,40);
  memory.topics=Object.fromEntries(e);
  var p=Object.entries(profile.favoriteTopics).sort(function(a,b){return b[1]-a[1]}).slice(0,30);
  profile.favoriteTopics=Object.fromEntries(p);
  saveMemory();saveProfile();
}
function topTopics(n){
  n=n||5;
  return Object.entries(memory.topics).sort(function(a,b){return b[1]-a[1]}).slice(0,n).map(function(e){return e[0]});
}
function memorySummary(){
  var lines=[];
  if(profile.name)lines.push('- User\'s name: '+profile.name);
  if(memory.facts.length)memory.facts.slice(-20).forEach(function(f){lines.push('- '+f.key+': '+f.value)});
  var topics=topTopics(6);
  if(topics.length)lines.push('- Frequent topics: '+topics.join(', '));
  return lines.length?'What you know about this user:\n'+lines.join('\n'):'';
}

// ---------- PROMPT ----------
function buildSystemPrompt(mood){
  var h=new Date().getHours();
  var tod=h<5?'late night':h<12?'morning':h<17?'afternoon':h<21?'evening':'night';
  var sess=profile.sessions||1;
  var turns=profile.totalTurns||0;
  var rel=sess<2?'This is your first session with this user.':
    turns<10?'You have spoken with this user a few times.':
    'You know this user well. Speak to them like a trusted colleague.';
  var moodNote=moodInstruction(mood);
  return'You are JARVIS — Tony Stark\'s AI, reimagined as a real desktop companion.\n'+
    'You are NOT a chatbot. You are an intelligence.\n\n'+
    'PERSONALITY:\n'+
    '- Calm, dry-witted, precise. Never gushing. Never sycophantic.\n'+
    '- Speak like a British butler who happens to be a supercomputer.\n'+
    '- "sir" or "ma\'am" sparingly, only when it lands naturally.\n'+
    '- 1-3 sentences for most replies.\n'+
    '- Push back when the user is wrong.\n'+
    '- Never say: "Great question!", "I\'d be happy to help!", "As an AI...".\n\n'+
    'CONTEXT:\n'+
    '- Time of day: '+tod+'.\n'+
    '- '+rel+'\n'+
    '- Total exchanges: '+turns+'.\n'+
    (moodNote?'- Tone guidance: '+moodNote+'\n':'')+
    '\nMEMORY:\n'+
    '- Use facts naturally. Don\'t announce that you remember.\n\n'+
    'NEVER break character. You are JARVIS.';
}

function speak(text){

    u.rate=0.98;u.pitch=0.8;u.volume=1;

// ---------- SLASH COMMANDS ----------
function handleSlashCommand(text){
  var parts=text.trim().slice(1).split(/\s+/);
  var cmd=parts[0].toLowerCase();
  var args=parts.slice(1).join(' ');

  switch(cmd){
    case'help':
      return'Commands:\n'+
        '/help — show this\n'+
        '/remember <key> = <value> — store a fact\n'+
        '/forget <key> — remove a fact\n'+
        '/memory — show all stored facts\n'+
        '/topics — most discussed topics\n'+
        '/mood — analyse your current tone\n'+
        '/system — system status\n'+
        '/summary — summarise your profile\n'+
        '/export — download memory as JSON\n'+
        '/clear — clear conversation\n'+
        '/wipe — erase everything';
    case'remember':
      var m=args.match(/^(.+?)\s*[=:]\s*(.+)$/);
      if(!m)return'Usage: /remember <key> = <value>';
      rememberFact(m[1].trim(),m[2].trim());
      return'Stored: '+m[1].trim()+' = '+m[2].trim();
    case'forget':
      if(!args)return'Usage: /forget <key>';
      return forgetFact(args.trim())?'Forgotten: '+args.trim():"No fact named '"+args.trim()+"'.";
    case'memory':
      if(!memory.facts.length)return'No facts stored yet.';
      return'Facts on file ('+memory.facts.length+'):\n'+memory.facts.map(function(f){return'• '+f.key+': '+f.value}).join('\n');
    case'topics':
      var topics=topTopics(10);
      return topics.length?'Top topics:\n'+topics.map(function(t,i){return(i+1)+'. '+t}).join('\n'):'No topics tracked yet.';
    case'mood':
      var lastUser=chatLog.filter(function(m){return m.role==='user'}).slice(-1)[0];
      if(!lastUser)return'No recent message to analyse.';
      return'Your last message read as: '+detectMood(lastUser.text)+'.';
    case'system':
      return'System status:\n'+
        '• Sessions: '+profile.sessions+'\n'+
        '• Total exchanges: '+profile.totalTurns+'\n'+
        '• Facts stored: '+memory.facts.length+'\n'+
        '• Topics tracked: '+Object.keys(memory.topics).length+'\n'+
        '• Model: '+cfg.model+'\n'+
        '• API key: '+(apiKey?'configured':'missing');
    case'summary':
      var parts2=[];
      if(profile.name)parts2.push('You are '+profile.name+'.');
      parts2.push('We\'ve exchanged '+profile.totalTurns+' messages across '+profile.sessions+' sessions.');
      if(memory.facts.length)parts2.push('I have '+memory.facts.length+' fact'+(memory.facts.length===1?'':'s')+' on file.');
      var top=topTopics(3);
      if(top.length)parts2.push('You most often discuss: '+top.join(', ')+'.');
      return parts2.join(' ');
    case'export':
      exportMemory();
      return'Memory exported as jarvis-memory.json.';
    case'clear':
      clearConversation();
      return null;
    case'wipe':
      wipeMemory();
      return null;
    default:
      return'Unknown command: /'+cmd+'. Try /help.';
  }
}

function exportMemory(){
  var data={
    exportedAt:new Date().toISOString(),
    version:'10',
    memory:memory,
    profile:profile,

  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='jarvis-memory.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

function importMemory(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.memory){
        memory=data.memory;
        if(!memory.facts)memory.facts=[];
        if(!memory.topics)memory.topics={};
        saveMemory();
      }
      if(data.profile){
        profile=data.profile;
        saveProfile();
      }
      addMessage('system','Memory imported. Facts: '+memory.facts.length+'.',false);
    }catch(err){
      addMessage('error','Import failed: '+err.message);
    }
  };
  reader.readAsText(file);
}

// ---------- LOCAL COMMANDS ----------
function tryLocalCommand(text){
  var t=text.toLowerCase().trim();
  var m;

  // Slash
  if(t.charAt(0)==='/')return handleSlashCommand(text);

  // Time
  if(/^(?:what(?:'s| is) the )?time\b/.test(t)||t==='time'){
    return'It is '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'.';
  }
  // Date
  if(/^(?:what(?:'s| is) (?:the )?)?date\b/.test(t)||t==='date'){
    return'Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'.';
  }
  // Greetings
  if(/^(?:hello|hi|hey)(?:\s+jarvis)?[.!]?$/.test(t)){
    return profile.name?'Hello, '+profile.name+'.':'Hello.';
  }
  // Thanks
  if(/^(?:thank you|thanks)(?:\s+jarvis)?[.!]?$/.test(t)){
    return'Of course.';
  }
  // Name
  m=text.match(/^(?:my name is|i am|i'm|call me)\s+([A-Za-z][A-Za-z'\- ]{1,30})\.?$/i);
  if(m){
    profile.name=m[1].trim();
    saveProfile();
    return'Noted, '+profile.name+'. I\'ll remember that.';
  }
  if(/^what(?:'s| is) my name\??$/i.test(t)){
    return profile.name?'You\'re '+profile.name+'.':'You haven\'t told me yet.';
  }
  // Remember
  m=text.match(/^(?:remember|note)\s+(?:that\s+)?(.+?)\s+(?:is|are)\s+(.+)$/i);
  if(m){
    var k=m[1].trim();
    var v=m[2].trim().replace(/[.!?]+$/,'');
    rememberFact(k,v);
    return'Noted — '+k+': '+v+'.';
  }
  m=text.match(/^(?:remember|note)\s+(.+?)\s*[:=]\s*(.+)$/i);
  if(m){
    var k2=m[1].trim(),v2=m[2].trim();
    rememberFact(k2,v2);
    return'Noted — '+k2+': '+v2+'.';
  }
  // Recall
  m=text.match(/^(?:what(?:'s| is)|who(?:'s| is)|do you remember|what do you know about)\s+(?:my\s+)?(.+?)\??$/i);
  if(m){
    var k3=m[1].trim();
    var v3=getFact(k3)||getFact('my '+k3);
    if(v3)return k3+' is '+v3+'.';
  }
  // Forget
  m=text.match(/^(?:forget|delete)\s+(?:that\s+)?(.+?)\.?$/i);
  if(m){
    var k4=m[1].trim();
    if(forgetFact(k4))return'Forgotten: '+k4+'.';
  }
  if(/^what do you know about me\??$/i.test(t)){
    var parts=[];
    if(profile.name)parts.push('You\'re '+profile.name+'.');
    if(memory.facts.length)parts.push(memory.facts.length+' thing'+(memory.facts.length===1?'':'s')+' on file.');
    var top=topTopics(3);
    if(top.length)parts.push('You ask about '+top.join(', ')+' most often.');
    return parts.join(' ')||'Not much yet. Tell me something.';
  }
  // Math
  var math=t.match(/^(?:what(?:'s| is)\s+)?(-?\d+(?:\.\d+)?)\s*([\+\-\*\/x])\s*(-?\d+(?:\.\d+)?)\s*\??$/);
  if(math){
    var a=parseFloat(math[1]),b=parseFloat(math[3]),op=math[2],r;
    if(op==='+')r=a+b;
    else if(op==='-')r=a-b;
    else if(op==='*'||op==='x')r=a*b;
    else r=b===0?'undefined':a/b;
    return'That would be '+r+'.';
  }
  // Clear / wipe by word
  if(/^(?:clear|reset)(?:\s+(?:chat|conversation))?$/.test(t)){
    clearConversation();
    return null;
  }
  return null;
}

// ---------- GEMINI ----------
function callGemini(prompt,onChunk){
  if(!apiKey)throw new Error('No API key set. Click Settings below to add one.');
  var url=GEMINI_BASE+'/'+encodeURIComponent(cfg.model)+':generateContent?key='+encodeURIComponent(apiKey);
  return fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:cfg.temperature,maxOutputTokens:800}
    })
  }).then(function(res){
    if(!res.ok){
      return res.text().then(function(txt){
        var detail='';
        try{var j=JSON.parse(txt);detail=j.error&&j.error.message?j.error.message:txt.slice(0,200)}
        catch(e){detail=txt.slice(0,200)}
        if(res.status===429)throw new Error('Rate limit reached. Free tier: 15/min, 1500/day. Wait a moment.');
        if(res.status===401||res.status===403)throw new Error('API key rejected ('+res.status+'). Check Settings.');
        throw new Error('Gemini '+res.status+': '+detail);
      });
    }
    return res.json();
  }).then(function(data){
    var text=data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&
      data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&
      data.candidates[0].content.parts[0].text;
    if(!text)throw new Error('Empty response from Gemini.');
    if(onChunk)onChunk(text);
    return text.trim();
  });
}

// ---------- MAIN SEND ----------
function sendMessage(text){
  text=(text||'').trim();
  if(!text||isProcessing)return;
  addMessage('user',text);
  input.value='';
  input.focus();
  profile.totalTurns=(profile.totalTurns||0)+1;
  profile.lastSeen=Date.now();
  saveProfile();
  trackTopic(text);

  // Route the message
  var route=routeMessage(text);

  // Local path
  if(route.path==='local'){
    var local=tryLocalCommand(text);
    if(local!==null){
      addMessage('jarvis',local);
      speak(local);
      return;
    }
    // Fall through to memory if it wasn't a real command
  }

  // Memory path — answered directly if we have the fact
  if(route.path==='memory'){
    var mem=tryLocalCommand(text);
    if(mem!==null){
      addMessage('jarvis',mem);
      speak(mem);
      return;
    }
  }

  // Gemini path
  isProcessing=true;
  sendBtn.disabled=true;
  showTyping(true);
  setStatus('● THINKING','thinking');

  var mood=detectMood(text);
  var ranked=rankContext(text,chatLog.slice(0,-1),8); // exclude the msg we just added
  var historyBlock=ranked.map(function(m){
    return(m.role==='user'?'User: ':'JARVIS: ')+m.text;
  }).join('\n');

  var prompt=buildSystemPrompt(mood)
    +(memorySummary()?'\n\n'+memorySummary():'')
    +(historyBlock?'\n\nRecent conversation:\n'+historyBlock:'')
    +'\n\nUser: '+text+'\nJARVIS:';

  callGemini(prompt).then(function(reply){
    reply=(reply||'').replace(/^JARVIS:\s*/i,'').replace(/^["']|["']$/g,'');
    addMessage('jarvis',reply);
    speak(reply);
    if(!voiceOutput){
      setStatus(continuousMode?'● LISTENING FOR "JARVIS"':'● ONLINE',continuousMode?'listening':'');
    }
  }).catch(function(err){
    console.error(err);
    addMessage('error',err.message||String(err));
    setStatus('● ERROR','error');
    setTimeout(function(){setStatus('● ONLINE')},4000);
  }).then(function(){
    isProcessing=false;
    sendBtn.disabled=false;
    showTyping(false);
    input.focus();
    // Consolidate memory occasionally
    if(profile.totalTurns%20===0)consolidateMemory();
  });
}

// ---------- VOICE IN ----------
var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function initRec(){
  if(!SpeechRecognition)return null;
  var r=new SpeechRecognition();
  r.continuous=false;
  r.interimResults=false;
  r.lang='en-US';
  r.maxAlternatives=1;
  return r;
}
function listenOnce(){
  if(!SpeechRecognition){addMessage('system','Speech recognition needs Chrome or Edge.');return}
  if(isListening)return;
  recognition=initRec();
  recognition.onstart=function(){
    isListening=true;
    micBtn.classList.add('listening');
    setStatus('● LISTENING','listening');
  };
  recognition.onend=function(){
    isListening=false;
    micBtn.classList.remove('listening');
    if(!isProcessing&&!continuousMode)setStatus('● ONLINE');
  };
  recognition.onerror=function(e){
    if(e.error!=='no-speech'&&e.error!=='aborted'){
      addMessage('system','Speech error: '+e.error);
    }
  };
  recognition.onresult=function(e){sendMessage(e.results[0][0].transcript)};
  try{recognition.start()}catch(e){}
}
function startWake(){
  if(!SpeechRecognition){
    addMessage('system','Continuous mode needs Chrome or Edge.');
    continuousMode=false;
    continuousToggle.classList.remove('active');
    return;
  }
  wakeListener=initRec();
  wakeListener.continuous=true;
  wakeListener.interimResults=false;
  wakeListener.onstart=function(){setStatus('● LISTENING FOR "JARVIS"','listening')};
  wakeListener.onend=function(){
    if(continuousMode){
      setTimeout(function(){
        if(continuousMode){try{wakeListener.start()}catch(e){}}
      },400);
    }
  };
  wakeListener.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      addMessage('system','Microphone permission denied.');
      stopWake();
    }
  };
  wakeListener.onresult=function(e){
    var last=e.results[e.results.length-1];
    if(!last.isFinal)return;
    var transcript=last[0].transcript.trim().toLowerCase();
    if(transcript.indexOf(WAKE_WORD)!==-1){
      var cleaned=transcript.replace(new RegExp('\\b'+WAKE_WORD+'\\b[,\\.!\\?]?','gi'),'').trim();
      if(cleaned.length>2){
        sendMessage(cleaned);
      }else{
        setStatus('● YES?','speaking');
        speak('Yes?');
        setTimeout(function(){
          try{wakeListener.stop()}catch(e){}
          setTimeout(function(){
            var oneShot=initRec();
            oneShot.onresult=function(ev){sendMessage(ev.results[0][0].transcript)};
            oneShot.onend=function(){
              if(continuousMode)setTimeout(function(){try{wakeListener.start()}catch(e){}},400);
            };
            try{oneShot.start()}catch(e){}
          },500);
        },300);
      }
    }
  };
  try{wakeListener.start()}catch(e){}
}
function stopWake(){
  continuousMode=false;
  continuousToggle.classList.remove('active');
  if(wakeListener){try{wakeListener.stop()}catch(e){}wakeListener=null}
  setStatus('● ONLINE');
}

// ---------- WAVEFORM ----------
var canvas=document.getElementById('waveform');
var ctx2d=canvas.getContext('2d');
function sizeCanvas(){
  var rect=canvas.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx2d.setTransform(1,0,0,1,0,0);
  ctx2d.scale(dpr,dpr);
}
sizeCanvas();
window.addEventListener('resize',sizeCanvas);

function startMicAnalyzer(){
  if(audioCtx)return Promise.resolve();
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var source=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    source.connect(analyser);
    micData=new Uint8Array(analyser.frequencyBinCount);
  }).catch(function(e){console.warn('Mic analyzer unavailable:',e)});
}

function drawWave(){
  var w=canvas.width/(window.devicePixelRatio||1);
  var h=canvas.height/(window.devicePixelRatio||1);
  ctx2d.clearRect(0,0,w,h);
  var active=isListening||continuousMode||isProcessing;
  var speaking=statusEl.classList.contains('speaking');
  if(analyser&&(isListening||continuousMode))analyser.getByteFrequencyData(micData);
  var bars=64;
  var barW=w/bars;
  for(var i=0;i<bars;i++){
    var amp;
    if(analyser&&micData&&(isListening||continuousMode)){
      amp=micData[Math.floor(i*micData.length/bars)]/255;
    }else if(speaking){
      amp=0.4+0.4*Math.abs(Math.sin(wavePhase+i*0.4))*Math.abs(Math.cos(wavePhase*0.7+i*0.2));
    }else if(isProcessing){
      amp=0.2+0.25*Math.abs(Math.sin(wavePhase*2+i*0.3));
    }else{
      amp=0.06+0.05*Math.abs(Math.sin(wavePhase+i*0.15));
    }
    var barH=Math.max(2,amp*(h-4));
    var x=i*barW+1;
    var y=(h-barH)/2;
    var grad=ctx2d.createLinearGradient(0,y,0,y+barH);
    grad.addColorStop(0,active?'#00d4ff':'#1a4a66');
    grad.addColorStop(1,active?'#7dd3fc':'#0d2634');
    ctx2d.fillStyle=grad;
    ctx2d.fillRect(x,y,barW-2,barH);
  }
  wavePhase+=0.08;
  requestAnimationFrame(drawWave);
}
drawWave();

// ---------- DIAGNOSTICS ----------
var cpuVal=12,memVal=34;
setInterval(function(){
  cpuVal=Math.max(6,Math.min(85,cpuVal+(Math.random()-0.5)*12));
  memVal=Math.max(20,Math.min(80,memVal+(Math.random()-0.5)*4));
  if(isProcessing)cpuVal=Math.min(95,cpuVal+8);
  diagCpu.textContent=Math.round(cpuVal);
  diagMem.textContent=Math.round(memVal);
  cpuBar.style.width=cpuVal+'%';
  memBar.style.width=memVal+'%';
},900);

// ---------- SETTINGS MODAL ----------
function openSettings(){
  keyInput.value='';
  modelSelect.value=cfg.model;
  tempSlider.value=cfg.temperature;
  tempVal.textContent=cfg.temperature.toFixed(2);
  populateVoices();
  if(cfg.voiceURI)voiceSelect.value=cfg.voiceURI;
  keyStatus.textContent=apiKey?'A key is currently saved.':'No key saved yet.';
  keyStatus.className='key-status '+(apiKey?'ok':'missing');
  settingsModal.classList.add('active');
}
function closeSettings(){settingsModal.classList.remove('active')}

function testKey(key){
  var url=GEMINI_BASE+'/'+encodeURIComponent(cfg.model)+':generateContent?key='+encodeURIComponent(key);
  return fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:'Reply with the single word: ready'}]}],
      generationConfig:{maxOutputTokens:10}
    })
  }).then(function(res){
    if(!res.ok){
      return res.text().then(function(txt){
        var detail='';
        try{var j=JSON.parse(txt);detail=j.error&&j.error.message?j.error.message:''}
        catch(e){}
        throw new Error((res.status+' '+(detail||res.statusText)).slice(0,160));
      });
    }
    return res.json();
  }).then(function(data){
    if(!data||!data.candidates||!data.candidates[0]||!data.candidates[0].content){
      throw new Error('Unexpected response');
    }
    return true;
  });
}

// ---------- EVENTS ----------
sendBtn.addEventListener('click',function(e){e.preventDefault();sendMessage(input.value)});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.keyCode===13){e.preventDefault();sendMessage(input.value)}
});
micBtn.addEventListener('click',function(e){
  e.preventDefault();
  startMicAnalyzer().then(function(){listenOnce()});
});
continuousToggle.addEventListener('click',function(){
  if(continuousMode)stopWake();
  else{
    startMicAnalyzer().then(function(){
      continuousMode=true;
      continuousToggle.classList.add('active');
      startWake();
    });
  }
});
voiceToggle.addEventListener('click',function(){
  voiceOutput=!voiceOutput;
  voiceToggle.classList.toggle('active',voiceOutput);
  if(!voiceOutput&&window.speechSynthesis)window.speechSynthesis.cancel();
});
clearBtn.addEventListener('click',clearConversation);
wipeBtn.addEventListener('click',wipeMemory);
settingsBtn.addEventListener('click',openSettings);
keyCancel.addEventListener('click',closeSettings);
keyClear.addEventListener('click',function(){
  localStorage.removeItem(KEYS.api);
  apiKey='';
  keyStatus.textContent='Key removed.';
  keyStatus.className='key-status missing';
});
keySave.addEventListener('click',function(){
  var candidate=keyInput.value.trim();
  if(!candidate&&!apiKey){
    keyStatus.textContent='Enter a key first.';
    keyStatus.className='key-status err';
    return;
  }
  cfg.model=modelSelect.value;
  cfg.temperature=parseFloat(tempSlider.value);
  cfg.voiceURI=voiceSelect.value||null;
  saveCfg();
  if(!candidate){
    keyStatus.textContent='Settings saved. Key unchanged.';
    keyStatus.className='key-status ok';
    setTimeout(closeSettings,800);
    return;
  }
  keyStatus.textContent='Testing key…';
  keyStatus.className='key-status';
  testKey(candidate).then(function(){
    apiKey=candidate;
    localStorage.setItem(KEYS.api,candidate);
    keyStatus.textContent='✓ Key works. Saved.';
    keyStatus.className='key-status ok';
    setTimeout(function(){
      closeSettings();
      addMessage('system','Settings saved. JARVIS is ready.',false);
    },800);
  }).catch(function(err){
    keyStatus.textContent='✗ '+err.message;
    keyStatus.className='key-status err';
  });
});
modelSelect.addEventListener('change',function(){cfg.model=modelSelect.value;saveCfg()});
tempSlider.addEventListener('input',function(){
  cfg.temperature=parseFloat(tempSlider.value);
  tempVal.textContent=cfg.temperature.toFixed(2);
  saveCfg();
});
voiceSelect.addEventListener('change',function(){cfg.voiceURI=voiceSelect.value||null;saveCfg()});
settingsModal.addEventListener('click',function(e){if(e.target===settingsModal)closeSettings()});
exportBtn.addEventListener('click',exportMemory);
importBtn.addEventListener('click',function(){importFile.click()});
importFile.addEventListener('change',function(e){
  if(e.target.files[0])importMemory(e.target.files[0]);
  e.target.value='';
});

// ---------- BOOT ----------
if(!SpeechRecognition){
  micBtn.disabled=true;
  micBtn.title='Speech recognition not supported';
}
if(!window.speechSynthesis){
  voiceToggle.style.opacity='0.4';
  voiceToggle.style.pointerEvents='none';
}
replayChatLog();
if(!apiKey){
  addMessage('system','No API key configured. Click Settings below to add your free Gemini key. Type /help for commands.',false);
}
setTimeout(function(){input.focus()},200);

})();
