<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #03060d; color: #e0f7ff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px; overflow: hidden;
  }
  .container {
    width: 100%; max-width: 900px;
    display: flex; flex-direction: column; height: 100%; max-height: 100vh;
  }
  .header {
    display: grid; grid-template-columns: 70px 1fr 70px;
    align-items: center; gap: 12px; padding: 8px 0 12px; flex-shrink: 0;
  }
  .orb {
    width: 62px; height: 62px;
    display: flex; align-items: center; justify-content: center;
  }
  .orb svg { width: 100%; height: 100%; }
  .orb .ring-a, .orb .ring-b, .orb .ring-c {
    transform-origin: 50px 50px; animation: spin 12s linear infinite;
  }
  .orb .ring-b { animation-duration: 8s; animation-direction: reverse; }
  .orb .ring-c { animation-duration: 5s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .orb .core { animation: pulse 2.4s ease-in-out infinite; transform-origin: 50px 50px; }
  @keyframes pulse { 0%,100% { opacity:.7; transform:scale(1); } 50% { opacity:1; transform:scale(1.15); } }
  .title-block { text-align: center; }
  .title-block h1 {
    font-size: 24px; letter-spacing: 10px; color: #00d4ff; font-weight: 300;
    text-shadow: 0 0 20px rgba(0,212,255,.7), 0 0 60px rgba(0,212,255,.3);
  }
  .status {
    font-size: 11px; color: #4a7a9b; letter-spacing: 3px;
    text-transform: uppercase; margin-top: 6px; height: 14px;
  }
  .status.listening { color: #00ff88; }
  .status.thinking  { color: #ffaa00; }
  .status.speaking  { color: #00d4ff; }
  .status.error     { color: #dc2626; }
  .diag { text-align: right; font-size: 9px; color: #3d5a73; letter-spacing: 1px; }
  .diag .bar { width: 50px; height: 3px; background: rgba(0,212,255,.1); border-radius:2px; margin: 3px 0 3px auto; overflow:hidden; }
  .diag .bar > div { height: 100%; background: #00d4ff; transition: width .5s; }

  .chat {
    flex: 1; background: rgba(10,16,28,.75);
    border: 1px solid rgba(0,212,255,.2); border-radius: 6px;
    padding: 18px; overflow-y: auto; margin-bottom: 10px;
    min-height: 0;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(0,212,255,.3); border-radius: 3px; }

  .msg { margin-bottom: 14px; line-height: 1.6; font-size: 15px; display: flex; gap: 10px; }
  .msg .label { font-weight: 700; min-width: 58px; flex-shrink: 0; font-size: 12px; letter-spacing: 1px; padding-top: 3px; }
  .msg.you  .label { color: #7dd3fc; }
  .msg.you  .text  { color: #cbe9fb; }
  .msg.jv   .label { color: #00d4ff; }
  .msg.jv   .text  { color: #e8faff; }
  .msg.sys  .label { color: #475569; }
  .msg.sys  .text  { color: #64748b; font-style: italic; font-size: 13px; }
  .msg.err  .label { color: #dc2626; }
  .msg.err  .text  { color: #fca5a5; }
  .msg .text { flex: 1; word-wrap: break-word; white-space: pre-wrap; }

  .input-area { display: flex; gap: 8px; flex-shrink: 0; }
  #input {
    flex: 1; background: rgba(20,30,48,.9);
    border: 1px solid rgba(0,212,255,.25); color: #e0f7ff;
    padding: 13px 15px; border-radius: 6px; font-size: 15px;
    outline: none; font-family: inherit;
  }
  #input:focus { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,.2); }
  #input::placeholder { color: #4a7a9b; }

  .btn {
    background: rgba(0,212,255,.1); border: 1px solid #00d4ff;
    color: #00d4ff; padding: 13px 18px; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    font-family: inherit; letter-spacing: 1px; flex-shrink: 0;
  }
  .btn:hover { background: rgba(0,212,255,.25); }
  .btn:active { transform: scale(.96); }
  .btn.mic { font-size: 18px; padding: 13px 15px; }
  .btn.mic.listening { background: rgba(220,38,38,.3); border-color: #dc2626; color: #fca5a5; }

  .mode-bar {
    display: flex; justify-content: center; gap: 16px;
    margin-top: 10px; font-size: 12px; flex-wrap: wrap; flex-shrink: 0;
  }
  .mode {
    display: flex; align-items: center; gap: 6px; color: #4a7a9b;
    cursor: pointer; user-select: none;
  }
  .mode:hover { color: #7dd3fc; }
  .mode.on { color: #00ff88; }
  .mode .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .mode.on .dot { box-shadow: 0 0 8px currentColor; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="orb">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="cg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e0faff"/>
            <stop offset="40%" stop-color="#00d4ff"/>
            <stop offset="100%" stop-color="#0066aa" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="core" cx="50" cy="50" r="16" fill="url(#cg)"/>
        <g class="ring-a" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity=".7">
          <circle cx="50" cy="50" r="44" stroke-dasharray="8 6 4 6"/>
        </g>
        <g class="ring-b" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".9">
          <circle cx="50" cy="50" r="34" stroke-dasharray="14 8"/>
        </g>
        <g class="ring-c" fill="none" stroke="#7dd3fc" stroke-width=".8" opacity=".85">
          <circle cx="50" cy="50" r="24" stroke-dasharray="3 4"/>
        </g>
      </svg>
    </div>
    <div class="title-block">
      <h1>J A R V I S</h1>
      <div class="status" id="status">● ONLINE</div>
    </div>
    <div class="diag">
      <div>CPU <span id="cpu">0</span>%</div>
      <div class="bar"><div id="cpuBar" style="width:0%"></div></div>
      <div>MEM <span id="mem">0</span>%</div>
      <div class="bar"><div id="memBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Ask JARVIS anything..." autocomplete="off">
    <button type="button" class="btn mic" id="micBtn">🎤</button>
    <button type="button" class="btn" id="sendBtn">SEND</button>
  </div>

  <div class="mode-bar">
    <div class="mode" id="continuousToggle"><span class="dot"></span><span>Continuous</span></div>
    <div class="mode on" id="voiceToggle"><span class="dot"></span><span>Voice</span></div>
    <div class="mode" id="clearBtn"><span class="dot" style="background:#dc2626"></span><span>Clear</span></div>
  </div>
</div>

<script>
(function() {
  // ========== ELEMENTS ==========
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var micBtn = document.getElementById('micBtn');
  var statusEl = document.getElementById('status');
  var continuousToggle = document.getElementById('continuousToggle');
  var voiceToggle = document.getElementById('voiceToggle');
  var clearBtn = document.getElementById('clearBtn');
  var cpuEl = document.getElementById('cpu');
  var memEl = document.getElementById('mem');
  var cpuBar = document.getElementById('cpuBar');
  var memBar = document.getElementById('memBar');

  // ========== STATE ==========
  var isProcessing = false;
  var continuousMode = false;
  var voiceOutput = true;
  var recognition = null;
  var isListening = false;
  var wakeListener = null;
  var memory = {};
  var history = [];

  // Load memory
  try { memory = JSON.parse(localStorage.getItem('jarvis_mem') || '{}'); } catch(e) { memory = {}; }

  // ========== HELPERS ==========
  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + (cls || '');
  }

  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = role === 'you' ? 'You' : role === 'jv' ? 'JARVIS' : role === 'err' ? 'ERR' : 'SYS';
    var body = document.createElement('span');
    body.className = 'text';
    body.textContent = text;
    div.appendChild(label);
    div.appendChild(body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function setOrbState(state) {
    // Reserved for future orb animation states
  }

  // ========== VOICE OUTPUT ==========
  function speak(text) {
    if (!voiceOutput || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.98; u.pitch = 0.8; u.volume = 1;
      var voices = window.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (/david|daniel|alex|google uk english male|microsoft david/i.test(voices[i].name)) {
          u.voice = voices[i]; break;
        }
      }
      u.onstart = function() { setStatus('● SPEAKING', 'speaking'); };
      u.onend = function() {
        if (continuousMode) setStatus('● LISTENING FOR "JARVIS"', 'listening');
        else setStatus('● ONLINE');
      };
      window.speechSynthesis.speak(u);
    } catch(e) { console.warn(e); }
  }

  // Preload voices
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() {};
  }

  // ========== LOCAL RESPONSES (always work) ==========
  function localReply(text) {
    var t = text.toLowerCase().trim();

    // Time/date
    if (/^(?:what(?:'s| is) the )?time/.test(t)) return 'It is ' + new Date().toLocaleTimeString() + '.';
    if (/^(?:what(?:'s| is) (?:the )?)?date/.test(t)) return 'Today is ' + new Date().toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'}) + '.';
    if (/^(?:hello|hi|hey)(?:\s+jarvis)?[.!]?$/.test(t)) return 'At your service.';
    if (/^(?:thank you|thanks)/.test(t)) return 'Of course.';
    if (/^(?:who are you|what are you)/.test(t)) return 'I am JARVIS. Your assistant.';

    // Name
    var m = t.match(/^(?:my name is|i am|i'm|call me)\s+([a-z][a-z'\- ]{1,30})\.?$/i);
    if (m) {
      memory.name = m[1].trim();
      try { localStorage.setItem('jarvis_mem', JSON.stringify(memory)); } catch(e){}
      return 'Noted, ' + memory.name + '. I\'ll remember that.';
    }
    if (/^(?:what(?:'s| is) my name)/.test(t)) {
      return memory.name ? 'You are ' + memory.name + '.' : 'You haven\'t told me your name yet.';
    }

    // Remember
    m = text.match(/^(?:remember|note)\s+(?:that\s+)?(.+?)\s+(?:is|are)\s+(.+)$/i);
    if (m) {
      var k = m[1].trim(), v = m[2].trim().replace(/[.!?]+$/, '');
      memory.facts = memory.facts || [];
      memory.facts = memory.facts.filter(function(f){ return f.k.toLowerCase() !== k.toLowerCase(); });
      memory.facts.push({k: k, v: v});
      try { localStorage.setItem('jarvis_mem', JSON.stringify(memory)); } catch(e){}
      return 'Noted — ' + k + ': ' + v + '.';
    }

    // Recall
    m = text.match(/^(?:what(?:'s| is)|what do you know about)\s+(.+?)\??$/i);
    if (m && memory.facts) {
      var key = m[1].trim().toLowerCase();
      for (var i = 0; i < memory.facts.length; i++) {
        if (memory.facts[i].k.toLowerCase() === key) return m[1] + ' is ' + memory.facts[i].v + '.';
      }
    }

    // Simple math
    var math = t.match(/^(?:what(?:'s| is)\s+)?(\d+(?:\.\d+)?)\s*([\+\-\*\/x])\s*(\d+(?:\.\d+)?)\s*\??$/);
    if (math) {
      var a = parseFloat(math[1]), b = parseFloat(math[3]), op = math[2];
      var r;
      if (op === '+') r = a + b;
      else if (op === '-') r = a - b;
      else if (op === '*' || op === 'x') r = a * b;
      else if (op === '/') r = b === 0 ? 'undefined (cannot divide by zero)' : a / b;
      return 'That would be ' + r + '.';
    }

    return null; // no local response
  }

  // ========== AI CALL (with free proxy) ==========
  function callAI(userText) {
    var sysPrompt = 'You are JARVIS, a calm, dry-witted British AI assistant. Keep replies to 1-3 sentences. Never say "Great question" or "As an AI".' +
      (memory.name ? ' The user\'s name is ' + memory.name + '.' : '') +
      (memory.facts && memory.facts.length ? ' Known facts: ' + memory.facts.map(function(f){return f.k+': '+f.v;}).join('; ') : '');

    var historyText = history.slice(-6).map(function(h) {
      return 'User: ' + h.user + '\nJARVIS: ' + h.assistant;
    }).join('\n\n');

    var fullPrompt = sysPrompt + (historyText ? '\n\nRecent:\n' + historyText : '') + '\n\nUser: ' + userText + '\nJARVIS:';

    // Try KeylessAI first
    return fetch('https://keylessai.thryx.workers.dev/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o',
        messages: [
          { role: 'system', content: sysPrompt },
          { role: 'user', content: userText }
        ],
        temperature: 0.7,
        max_tokens: 300
      })
    })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      if (d && d.choices && d.choices[0] && d.choices[0].message) {
        return d.choices[0].message.content;
      }
      throw new Error('Bad response');
    })
    .catch(function() {
      // Fallback: Pollinations
      return fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'openai-fast',
          messages: [
            { role: 'system', content: sysPrompt },
            { role: 'user', content: userText }
          ]
        })
      })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d) {
        if (d && d.choices && d.choices[0] && d.choices[0].message) {
          return d.choices[0].message.content;
        }
        throw new Error('Bad response');
      });
    });
  }

  // ========== SEND ==========
  function send() {
    if (isProcessing) return;
    var text = input.value.trim();
    if (!text) return;

    addMsg('you', text);
    input.value = '';
    input.focus();

    // 1. Try local reply
    var local = localReply(text);
    if (local) {
      setTimeout(function() {
        addMsg('jv', local);
        speak(local);
        history.push({ user: text, assistant: local });
      }, 200);
      return;
    }

    // 2. Try AI
    isProcessing = true;
    sendBtn.disabled = true;
    setStatus('● THINKING', 'thinking');

    var typingDiv = document.createElement('div');
    typingDiv.className = 'msg sys';
    typingDiv.innerHTML = '<span class="label">SYS</span><span class="text">thinking...</span>';
    chat.appendChild(typingDiv);
    chat.scrollTop = chat.scrollHeight;

    callAI(text)
      .then(function(reply) {
        chat.removeChild(typingDiv);
        reply = (reply || '').trim().replace(/^JARVIS:\s*/i, '');
        if (!reply) reply = 'I have nothing to say to that.';
        addMsg('jv', reply);
        speak(reply);
        history.push({ user: text, assistant: reply });
        if (history.length > 20) history.shift();
      })
      .catch(function(err) {
        chat.removeChild(typingDiv);
        addMsg('err', 'AI unavailable. Local replies still work. Try asking the time or your name.');
        setStatus('● LOCAL MODE', '');
      })
      .then(function() {
        isProcessing = false;
        sendBtn.disabled = false;
        if (voiceOutput) {
          // status handled by speak()
        } else {
          if (continuousMode) setStatus('● LISTENING FOR "JARVIS"', 'listening');
          else setStatus('● ONLINE');
        }
      });
  }

  // ========== VOICE INPUT ==========
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function makeRec() {
    if (!SR) return null;
    var r = new SR();
    r.continuous = false;
    r.interimResults = false;
    r.lang = 'en-US';
    r.maxAlternatives = 1;
    return r;
  }

  function listenOnce() {
    if (!SR) { addMsg('sys', 'Voice not supported in this browser. Use Chrome or Edge.'); return; }
    if (isListening) return;
    recognition = makeRec();
    recognition.onstart = function() {
      isListening = true;
      micBtn.classList.add('listening');
      setStatus('● LISTENING', 'listening');
    };
    recognition.onend = function() {
      isListening = false;
      micBtn.classList.remove('listening');
      if (!isProcessing && !continuousMode) setStatus('● ONLINE');
    };
    recognition.onerror = function(e) {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        addMsg('sys', 'Speech error: ' + e.error);
      }
    };
    recognition.onresult = function(e) {
      send2(e.results[0][0].transcript);
    };
    try { recognition.start(); } catch(e) {}
  }

  // Voice-in goes through same path as typed input
  function send2(text) {
    input.value = text;
    send();
  }

  function startWake() {
    if (!SR) { addMsg('sys', 'Continuous mode needs Chrome or Edge.'); continuousMode = false; continuousToggle.classList.remove('on'); return; }
    wakeListener = makeRec();
    wakeListener.continuous = true;
    wakeListener.interimResults = false;
    wakeListener.onstart = function() { setStatus('● LISTENING FOR "JARVIS"', 'listening'); };
    wakeListener.onend = function() {
      if (continuousMode) {
        setTimeout(function() {
          if (continuousMode) { try { wakeListener.start(); } catch(e){} }
        }, 400);
      }
    };
    wakeListener.onerror = function(e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        addMsg('sys', 'Microphone permission denied.');
        stopWake();
      }
    };
    wakeListener.onresult = function(e) {
      var last = e.results[e.results.length - 1];
      if (!last.isFinal) return;
      var transcript = last[0].transcript.trim().toLowerCase();
      if (transcript.indexOf('jarvis') !== -1) {
        var cleaned = transcript.replace(/\bjarvis\b[,\.!?]?/gi, '').trim();
        if (cleaned.length > 2) {
          send2(cleaned);
        } else {
          speak('Yes?');
          setTimeout(function() {
            try { wakeListener.stop(); } catch(e){}
            setTimeout(function() {
              var oneShot = makeRec();
              oneShot.onresult = function(ev) { send2(ev.results[0][0].transcript); };
              oneShot.onend = function() {
                if (continuousMode) setTimeout(function(){ try { wakeListener.start(); } catch(e){} }, 400);
              };
              try { oneShot.start(); } catch(e){}
            }, 500);
          }, 300);
        }
      }
    };
    try { wakeListener.start(); } catch(e){}
  }

  function stopWake() {
    continuousMode = false;
    continuousToggle.classList.remove('on');
    if (wakeListener) { try { wakeListener.stop(); } catch(e){} wakeListener = null; }
    setStatus('● ONLINE');
  }

  // ========== UI EVENTS ==========
  sendBtn.addEventListener('click', function(e) {
    e.preventDefault();
    send();
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      send();
    }
  });

  micBtn.addEventListener('click', function(e) {
    e.preventDefault();
    listenOnce();
  });

  continuousToggle.addEventListener('click', function() {
    if (continuousMode) stopWake();
    else {
      continuousMode = true;
      continuousToggle.classList.add('on');
      startWake();
    }
  });

  voiceToggle.addEventListener('click', function() {
    voiceOutput = !voiceOutput;
    voiceToggle.classList.toggle('on', voiceOutput);
    if (!voiceOutput && window.speechSynthesis) window.speechSynthesis.cancel();
  });

  clearBtn.addEventListener('click', function() {
    chat.innerHTML = '';
    history = [];
    addMsg('sys', 'Conversation cleared. Memory retained.');
  });

  // ========== DIAGNOSTICS ==========
  var cpuVal = 15, memVal = 32;
  setInterval(function() {
    cpuVal = Math.max(6, Math.min(85, cpuVal + (Math.random() - 0.5) * 12));
    memVal = Math.max(20, Math.min(80, memVal + (Math.random() - 0.5) * 4));
    if (isProcessing) cpuVal = Math.min(95, cpuVal + 8);
    cpuEl.textContent = Math.round(cpuVal);
    memEl.textContent = Math.round(memVal);
    cpuBar.style.width = cpuVal + '%';
    memBar.style.width = memVal + '%';
  }, 900);

  // ========== BOOT ==========
  var h = new Date().getHours();
  var greeting = memory.name ? ', ' + memory.name : '';
  var greet;
  if (h < 5) greet = 'Working late' + greeting + '?';
  else if (h < 12) greet = 'Good morning' + greeting + '.';
  else if (h < 17) greet = 'Afternoon' + greeting + '.';
  else if (h < 21) greet = 'Evening' + greeting + '.';
  else greet = 'Late one' + greeting + '?';
  addMsg('jv', greet + ' I\'m online. Try "hello", "time", "my name is Tony", or ask me anything.');

  setTimeout(function() { input.focus(); }, 200);
})();
</script>

</body>
</html>
