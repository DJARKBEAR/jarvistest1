<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0e1a;
    color: #e0f7ff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background: radial-gradient(circle at center, rgba(0, 212, 255, 0.07) 0%, transparent 55%);
    animation: pulse 9s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .container {
    width: 100%;
    max-width: 820px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    max-height: 100vh;
  }

  .header {
    text-align: center;
    padding: 12px 0 16px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 26px;
    letter-spacing: 10px;
    color: #00d4ff;
    text-shadow: 0 0 20px rgba(0, 212, 255, 0.5), 0 0 60px rgba(0, 212, 255, 0.2);
    font-weight: 300;
    margin-left: 10px;
  }

  .status {
    font-size: 11px;
    color: #4a7a9b;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
    transition: color 0.3s;
    height: 14px;
  }

  .status.listening {
    color: #00ff88;
    animation: blink 1.2s ease-in-out infinite;
  }

  .status.thinking {
    color: #ffaa00;
    animation: blink 0.8s ease-in-out infinite;
  }

  .status.speaking {
    color: #00d4ff;
    animation: blink 1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .chat-wrapper {
    flex: 1;
    background: rgba(17, 24, 39, 0.85);
    border: 1px solid rgba(0, 212, 255, 0.15);
    border-radius: 12px;
    padding: 18px;
    overflow-y: auto;
    margin-bottom: 12px;
    backdrop-filter: blur(10px);
    scroll-behavior: smooth;
    min-height: 0;
  }

  .chat-wrapper::-webkit-scrollbar { width: 6px; }
  .chat-wrapper::-webkit-scrollbar-track { background: transparent; }
  .chat-wrapper::-webkit-scrollbar-thumb {
    background: rgba(0, 212, 255, 0.3);
    border-radius: 3px;
  }

  .msg {
    margin-bottom: 14px;
    line-height: 1.6;
    font-size: 15px;
    animation: fadeIn 0.3s ease-out;
    display: flex;
    gap: 10px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .label {
    font-weight: 600;
    min-width: 60px;
    flex-shrink: 0;
    font-size: 13px;
    padding-top: 2px;
  }

  .msg.user .label { color: #7dd3fc; }
  .msg.user .text { color: #bae6fd; }
  .msg.jarvis .label { color: #00d4ff; }
  .msg.jarvis .text { color: #e0f7ff; }
  .msg.system .label { color: #64748b; }
  .msg.system .text { color: #64748b; font-style: italic; font-size: 13px; }

  .msg .text { flex: 1; word-wrap: break-word; white-space: pre-wrap; }

  .typing {
    display: none;
    gap: 4px;
    padding: 6px 0 12px 70px;
  }

  .typing.active { display: flex; }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00d4ff;
    animation: bounce 1.2s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.35; }
    40% { transform: scale(1); opacity: 1; }
  }

  .input-area {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(0, 212, 255, 0.2);
    color: #e0f7ff;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    font-family: inherit;
    min-width: 0;
  }

  .input-area input:focus {
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
  }

  .input-area input::placeholder { color: #4a7a9b; }

  .btn {
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid #00d4ff;
    color: #00d4ff;
    padding: 13px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn:hover:not(:disabled) {
    background: rgba(0, 212, 255, 0.25);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
  }

  .btn:active:not(:disabled) { transform: scale(0.96); }

  .btn.mic { font-size: 18px; padding: 13px 15px; }

  .btn.mic.listening {
    background: rgba(220, 38, 38, 0.3);
    border-color: #dc2626;
    color: #fca5a5;
    animation: micPulse 1.2s ease-in-out infinite;
  }

  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
  }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .mode-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    font-size: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .mode-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #4a7a9b;
    cursor: pointer;
    user-select: none;
    transition: color 0.3s;
  }

  .mode-toggle:hover { color: #7dd3fc; }
  .mode-toggle.active { color: #00ff88; }
  .mode-toggle.active.voice { color: #00d4ff; }

  .mode-toggle .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    transition: all 0.3s;
  }

  .mode-toggle.active .dot { box-shadow: 0 0 8px currentColor; }

  @media (max-width: 600px) {
    .header h1 { font-size: 19px; letter-spacing: 6px; }
    .msg .label { min-width: 48px; font-size: 12px; }
    .msg { font-size: 14px; }
    .btn { padding: 12px 13px; font-size: 13px; }
    .btn.mic { font-size: 16px; padding: 12px 12px; }
    .mode-bar { font-size: 11px; gap: 12px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>J A R V I S</h1>
    <div class="status" id="status">● ONLINE</div>
  </div>

  <div class="chat-wrapper" id="chat">
    <div class="msg system">
      <span class="label">SYS</span>
      <span class="text">JARVIS online. Type a message or click the mic. Enable Continuous Mode to use the wake word "Jarvis".</span>
    </div>
    <div class="typing" id="typing"><span></span><span></span><span></span></div>
  </div>

  <div class="input-area">
    <input id="input" placeholder="Ask JARVIS anything..." autocomplete="off">
    <button class="btn mic" id="micBtn" title="Click to speak">🎤</button>
    <button class="btn" id="sendBtn">Send</button>
  </div>

  <div class="mode-bar">
    <div class="mode-toggle" id="continuousToggle" title="Listen continuously for the wake word 'Jarvis'">
      <span class="dot"></span>
      <span>Continuous Mode</span>
    </div>
    <div class="mode-toggle voice active" id="voiceToggle" title="Speak responses aloud">
      <span class="dot"></span>
      <span>Voice Output</span>
    </div>
    <div class="mode-toggle" id="clearBtn" title="Clear conversation">
      <span class="dot" style="background:#dc2626;"></span>
      <span>Clear</span>
    </div>
  </div>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
// ============================================================
// JARVIS — Browser AI Assistant
// No API key. No backend. Runs entirely in the browser.
// AI: Puter.js (user-pays model, no developer key needed)
// Voice In: Web Speech API (Chrome/Edge/Safari)
// Voice Out: Speech Synthesis API
// ============================================================

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const status = document.getElementById('status');
const typing = document.getElementById('typing');
const continuousToggle = document.getElementById('continuousToggle');
const voiceToggle = document.getElementById('voiceToggle');
const clearBtn = document.getElementById('clearBtn');

// ---------- STATE ----------
const WAKE_WORD = 'jarvis';
const MODEL = 'gpt-5-nano';
const MEMORY_KEY = 'jarvis_memory_v1';

let conversationHistory = [];
let isProcessing = false;
let continuousMode = false;
let voiceOutput = true;
let recognition = null;
let isListening = false;
let wakeListener = null;
let memory = loadMemory();

const SYSTEM_PROMPT = `You are JARVIS, a highly capable AI assistant inspired by Iron Man's AI.
You are concise, intelligent, slightly witty, and always helpful.
Keep replies short (1-4 sentences) unless the user asks for detail.
Never mention that you are an AI language model or a chatbot. You are JARVIS.
If the user gives you a fact to remember, acknowledge it briefly.`;

// ---------- MEMORY (localStorage) ----------
function loadMemory() {
  try {
    return JSON.parse(localStorage.getItem(MEMORY_KEY)) || { facts: [] };
  } catch (e) {
    return { facts: [] };
  }
}

function saveMemory() {
  try {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
  } catch (e) {}
}

function rememberFact(key, value) {
  memory.facts = memory.facts.filter(f => f.key.toLowerCase() !== key.toLowerCase());
  memory.facts.push({ key, value, time: Date.now() });
  if (memory.facts.length > 50) memory.facts.shift();
  saveMemory();
}

function getFact(key) {
  const f = memory.facts.find(f => f.key.toLowerCase() === key.toLowerCase());
  return f ? f.value : null;
}

function forgetFact(key) {
  const before = memory.facts.length;
  memory.facts = memory.facts.filter(f => f.key.toLowerCase() !== key.toLowerCase());
  saveMemory();
  return memory.facts.length < before;
}

function memorySummary() {
  if (!memory.facts.length) return '';
  return 'Known facts about the user:\n' +
    memory.facts.slice(-15).map(f => `- ${f.key}: ${f.value}`).join('\n');
}

// ---------- UI HELPERS ----------
function setStatus(text, cls = '') {
  status.textContent = text;
  status.className = 'status ' + cls;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = role === 'user' ? 'You' : role === 'jarvis' ? 'JARVIS' : 'SYS';
  const body = document.createElement('span');
  body.className = 'text';
  body.textContent = text;
  div.appendChild(label);
  div.appendChild(body);
  chat.insertBefore(div, typing);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(show) {
  typing.classList.toggle('active', show);
  if (show) chat.scrollTop = chat.scrollHeight;
}

// ---------- VOICE OUTPUT ----------
function speak(text) {
  if (!voiceOutput || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02;
    u.pitch = 0.85;
    u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      /david|daniel|alex|google uk english male|microsoft david/i.test(v.name)
    ) || voices.find(v => v.lang && v.lang.startsWith('en'));
    if (preferred) u.voice = preferred;
    u.onstart = () => setStatus('● SPEAKING', 'speaking');
    u.onend = () => {
      if (continuousMode) setStatus('● LISTENING FOR "JARVIS"', 'listening');
      else setStatus('● ONLINE');
    };
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.warn('TTS error', e);
  }
}

// Preload voices
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();
}

// ---------- MEMORY COMMANDS ----------
function tryMemoryCommand(text) {
  const t = text.trim();

  let m = t.match(/^(?:remember|note)\s+(?:that\s+)?(.+?)\s+(?:is|are)\s+(.+)$/i);
  if (m) {
    const key = m[1].trim();
    const value = m[2].trim().replace(/[.!?]+$/, '');
    rememberFact(key, value);
    return `Noted. I'll remember that ${key} is ${value}.`;
  }

  m = t.match(/^(?:remember|note)\s+(.+?)\s*[:=]\s*(.+)$/i);
  if (m) {
    const key = m[1].trim();
    const value = m[2].trim();
    rememberFact(key, value);
    return `Noted: ${key} = ${value}.`;
  }

  m = t.match(/^(?:what(?:'s| is)|who(?:'s| is)|do you remember)\s+(?:my\s+)?(.+?)\??$/i);
  if (m) {
    const key = m[1].trim();
    const v = getFact(key);
    if (v) return `${key} is ${v}.`;
    const v2 = getFact('my ' + key);
    if (v2) return `Your ${key} is ${v2}.`;
  }

  m = t.match(/^(?:forget|delete)\s+(?:that\s+)?(.+?)\.?$/i);
  if (m) {
    const key = m[1].trim();
    if (forgetFact(key)) return `Forgotten: ${key}.`;
  }

  return null;
}

// ---------- DIRECT COMMANDS ----------
function tryDirectCommand(text) {
  const t = text.toLowerCase().trim();

  if (/^(?:what(?:'s| is) the )?time\b/.test(t) || t === 'time') {
    return 'It is ' + new Date().toLocaleTimeString() + '.';
  }

  if (/^(?:what(?:'s| is) (?:the )?)?date\b/.test(t) || t === 'date') {
    return 'Today is ' + new Date().toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    }) + '.';
  }

  if (/^(?:clear|reset)(?:\s+(?:chat|conversation))?$/.test(t)) {
    clearConversation();
    return 'Conversation cleared.';
  }

  if (/^(?:hello|hi|hey)(?:\s+jarvis)?[.!]?$/.test(t)) {
    return 'At your service.';
  }

  if (/^(?:thank you|thanks)(?:\s+jarvis)?[.!]?$/.test(t)) {
    return 'Always a pleasure.';
  }

  return null;
}

function clearConversation() {
  conversationHistory = [];
  const wrapper = document.getElementById('chat');
  wrapper.querySelectorAll('.msg').forEach(m => m.remove());
  addMessage('system', 'Conversation cleared.');
}

// ---------- CORE: SEND MESSAGE ----------
async function sendMessage(text) {
  text = (text || '').trim();
  if (!text || isProcessing) return;

  addMessage('user', text);
  input.value = '';

  // Direct + memory commands
  const direct = tryDirectCommand(text);
  if (direct) {
    addMessage('jarvis', direct);
    speak(direct);
    conversationHistory.push({ user: text, assistant: direct });
    return;
  }

  const mem = tryMemoryCommand(text);
  if (mem) {
    addMessage('jarvis', mem);
    speak(mem);
    conversationHistory.push({ user: text, assistant: mem });
    return;
  }

  // Build prompt for the AI
  isProcessing = true;
  sendBtn.disabled = true;
  showTyping(true);
  setStatus('● THINKING', 'thinking');

  try {
    const facts = memorySummary();
    const historyBlock = conversationHistory.slice(-6)
      .map(t => `User: ${t.user}\nJARVIS: ${t.assistant}`)
      .join('\n\n');

    const fullPrompt =
      SYSTEM_PROMPT +
      (facts ? `\n\n${facts}` : '') +
      (historyBlock ? `\n\nRecent conversation:\n${historyBlock}` : '') +
      `\n\nUser: ${text}\nJARVIS:`;

    let reply;
    if (typeof puter !== 'undefined' && puter.ai) {
      const response = await puter.ai.chat(fullPrompt, { model: MODEL });
      reply = typeof response === 'string'
        ? response
        : (response?.message?.content || response?.text || String(response));
    } else {
      reply = "I can't reach my language core right now. Please reload the page.";
    }

    reply = (reply || '').trim().replace(/^JARVIS:\s*/i, '');
    addMessage('jarvis', reply);
    speak(reply);
    conversationHistory.push({ user: text, assistant: reply });
    if (conversationHistory.length > 20) conversationHistory.shift();

    if (!voiceOutput) {
      setStatus(continuousMode ? '● LISTENING FOR "JARVIS"' : '● ONLINE',
                continuousMode ? 'listening' : '');
    }
  } catch (err) {
    console.error(err);
    const errMsg = 'I ran into an error: ' + (err.message || err);
    addMessage('jarvis', errMsg);
    setStatus('● ERROR');
    setTimeout(() => setStatus('● ONLINE'), 3000);
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    showTyping(false);
  }
}

// ---------- VOICE INPUT ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRecognition() {
  if (!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.continuous = false;
  r.interimResults = false;
  r.lang = 'en-US';
  r.maxAlternatives = 1;
  return r;
}

// Single-shot listen (mic button)
function listenOnce() {
  if (!SpeechRecognition) {
    addMessage('system', 'Speech recognition is not supported in this browser. Use Chrome or Edge.');
    return;
  }
  if (isListening) return;

  recognition = initRecognition();
  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    setStatus('● LISTENING', 'listening');
  };
  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    if (!isProcessing && !continuousMode) setStatus('● ONLINE');
  };
  recognition.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      addMessage('system', 'Speech error: ' + e.error);
    }
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    sendMessage(transcript);
  };

  try { recognition.start(); } catch (e) {}
}

// Continuous wake-word listener
function startWakeListener() {
  if (!SpeechRecognition) {
    addMessage('system', 'Continuous mode requires Chrome or Edge.');
    continuousMode = false;
    continuousToggle.classList.remove('active');
    return;
  }

  wakeListener = initRecognition();
  wakeListener.continuous = true;
  wakeListener.interimResults = false;

  wakeListener.onstart = () => {
    setStatus('● LISTENING FOR "JARVIS"', 'listening');
  };

  wakeListener.onend = () => {
    if (continuousMode) {
      // auto-restart if browser stopped it
      setTimeout(() => {
        if (continuousMode) {
          try { wakeListener.start(); } catch (e) {}
        }
      }, 400);
    }
  };

  wakeListener.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      addMessage('system', 'Microphone permission denied.');
      stopWakeListener();
    }
  };

  wakeListener.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    if (!last.isFinal) return;
    const transcript = last[0].transcript.trim();
    const lower = transcript.toLowerCase();

    if (lower.includes(WAKE_WORD)) {
      const cleaned = lower
        .replace(new RegExp('\\b' + WAKE_WORD + '\\b[,\\.!\\?]?', 'gi'), '')
        .trim();
      if (cleaned.length > 2) {
        // Command spoke in same breath
        sendMessage(cleaned);
      } else {
        // Just "Jarvis" — ask and listen once
        setStatus('● YES?', 'speaking');
        speak('Yes?');
        setTimeout(() => {
          // Pause wake listener, do single listen, then resume
          try { wakeListener.stop(); } catch (e) {}
          setTimeout(() => {
            const oneShot = initRecognition();
            oneShot.onresult = (ev) => sendMessage(ev.results[0][0].transcript);
            oneShot.onend = () => {
              if (continuousMode) {
                setTimeout(() => { try { wakeListener.start(); } catch (e) {} }, 400);
              }
            };
            try { oneShot.start(); } catch (e) {}
          }, 500);
        }, 300);
      }
    }
  };

  try { wakeListener.start(); } catch (e) {}
}

function stopWakeListener() {
  continuousMode = false;
  continuousToggle.classList.remove('active');
  if (wakeListener) {
    try { wakeListener.stop(); } catch (e) {}
    wakeListener = null;
  }
  setStatus('● ONLINE');
}

// ---------- EVENT BINDINGS ----------
sendBtn.addEventListener('click', () => sendMessage(input.value));

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});

micBtn.addEventListener('click', listenOnce);

continuousToggle.addEventListener('click', () => {
  if (continuousMode) {
    stopWakeListener();
  } else {
    continuousMode = true;
    continuousToggle.classList.add('active');
    startWakeListener();
  }
});

voiceToggle.addEventListener('click', () => {
  voiceOutput = !voiceOutput;
  voiceToggle.classList.toggle('active', voiceOutput);
  if (!voiceOutput && window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
});

clearBtn.addEventListener('click', () => {
  clearConversation();
});

// ---------- INIT ----------
window.addEventListener('load', () => {
  if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
    micBtn.disabled = true;
    micBtn.title = 'Speech recognition not supported in this browser';
  }
  if (!window.speechSynthesis) {
    voiceToggle.style.opacity = '0.4';
    voiceToggle.style.pointerEvents = 'none';
  }
  setTimeout(() => input.focus(), 200);
});
</script>
</body>
</html>
